name: team11-coach

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-team11_coach}
      POSTGRES_USER: ${POSTGRES_USER:-team11_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./src/backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-team11_coach}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-team11_local}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      SESSION_COOKIE_SECURE: 'false'
      BOOKING_EXPIRY_CLEANUP_ENABLED: ${BOOKING_EXPIRY_CLEANUP_ENABLED:-true}
      BOOKING_EXPIRY_CLEANUP_INTERVAL: ${BOOKING_EXPIRY_CLEANUP_INTERVAL:-PT5S}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-PT10S}
      AI_QUOTA_PER_MINUTE: ${AI_QUOTA_PER_MINUTE:-5}
      AI_QUOTA_DAILY_DEMO: ${AI_QUOTA_DAILY_DEMO:-200}
      SUPPORT_CONTACT_CHANNEL: ${SUPPORT_CONTACT_CHANNEL:-}
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/health]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: ./src/frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
