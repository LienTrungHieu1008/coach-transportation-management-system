name: team11-coach

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-team11_coach}
      POSTGRES_USER: ${POSTGRES_USER:-team11_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./src/backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-team11_coach}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-team11_local}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      SESSION_COOKIE_SECURE: 'false'
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/health]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: ./src/frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
